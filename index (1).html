  #side .head .k{ font-size:11px; letter-spacing:.04em; color:var(--yellow); font-weight:600; }
  #side .head h1{ font-size:20px; font-weight:700; margin-top:8px; line-height:1.15; }
  #side .head p{ margin:10px 0 0; font-size:12.5px; color:rgba(255,255,255,.55); line-height:1.5; }

  .lessonbtn{
    display:block; width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
    color:var(--white); padding:12px 24px; border-left:3px solid transparent;
    font-family:'Inter',sans-serif;
  }
  .lessonbtn:hover{ background:rgba(255,255,255,.05); }
  .lessonbtn.active{ background:rgba(255,255,255,.08); border-left-color:var(--yellow); }
  .lessonbtn .row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .lessonbtn .num{ font-family:'Space Grotesk'; font-size:12px; color:rgba(255,255,255,.4); }
  .lessonbtn .title{ font-size:13.5px; font-weight:600; margin-top:3px; line-height:1.3; }
  .lessonbtn .date{ font-size:11px; color:rgba(255,255,255,.45); margin-top:4px; }
  .lessonbtn.locked .title{ color:rgba(255,255,255,.35); }
  .lessonbtn .lock{ font-size:11px; color:var(--yellow); }

  /* ---- main ---- */
  #main{ flex:1; min-width:0; overflow-y:auto; }
  #content{ max-width:760px; margin:0 auto; padding:48px 40px 80px; }
  .l-kicker{ font-size:12px; font-weight:600; color:var(--blue); letter-spacing:.02em; }
  .l-title{ font-size:clamp(24px,3vw,34px); font-weight:700; margin-top:10px; line-height:1.15; }
  .l-meta{ margin-top:10px; font-size:13px; color:var(--graphite-60); }

  section.block{ margin-top:38px; }
  section.block h2{ font-size:13px; font-weight:600; letter-spacing:.03em; color:var(--graphite); padding-bottom:8px; border-bottom:2px solid var(--yellow); display:inline-block; }
  section.block .txt{ margin-top:14px; font-size:15px; line-height:1.6; color:var(--graphite); }
  section.block ul, section.block ol{ margin:14px 0 0; padding-left:20px; }
  section.block li{ font-size:15px; line-height:1.65; margin-bottom:6px; }
  section.block.skip{ background:var(--blue-soft); border-left:3px solid var(--blue); padding:18px 20px; }
  section.block.skip a{ color:var(--blue); font-weight:600; }
  section.block.skip h2{ border-bottom-color:var(--blue); }
  section.block.files{ border:1px solid var(--line); padding:18px 20px; }
  ol.step-illustrated{ list-style:none; margin:14px 0 0; padding:0; counter-reset:step; }
  ol.step-illustrated > li{ counter-increment:step; margin-bottom:22px; padding-left:34px; position:relative; }
  ol.step-illustrated > li::before{
    content:counter(step); position:absolute; left:0; top:1px;
    width:24px; height:24px; border-radius:50%; background:var(--graphite); color:var(--white);
    font-family:'Space Grotesk'; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center;
  }
  .step-text{ font-size:15px; line-height:1.6; }
  .step-shot{ margin-top:10px; border:1px solid var(--line); background:var(--grey); max-width:460px; }
  .step-shot img{ display:block; width:100%; max-height:220px; object-fit:contain; background:var(--white); }
  .step-shot .cap{ padding:7px 10px; font-size:11.5px; color:var(--graphite-60); border-top:1px solid var(--line); }

  .locked-panel{ margin-top:40px; padding:28px; border:1px dashed var(--graphite-35); background:var(--grey); }
  .locked-panel .txt{ font-size:14.5px; color:var(--graphite-60); line-height:1.6; }

  .content-wrap{ position:relative; }
  .access-note{
    margin-top:14px; font-size:12px; line-height:1.55; color:rgba(255,255,255,.5);
    border-top:1px solid rgba(255,255,255,.14); padding-top:12px;
  }

  #mobilenav{ display:none; }
  @media (max-width:880px){
    #shell{ flex-direction:column; }
    #side{ width:100%; height:auto; padding:0; }
    #side .head{ padding:22px 20px 16px; }
    #side .lessons{ display:flex; overflow-x:auto; gap:0; }
    .lessonbtn{ width:auto; flex:none; min-width:150px; border-left:none; border-bottom:3px solid transparent; padding:12px 16px; }
    .lessonbtn.active{ border-left:none; border-bottom-color:var(--yellow); }
    #content{ padding:28px 18px 60px; }
  }
</style>
</head>

const WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function fmt(iso){
  const d = new Date(iso+'T00:00:00');
  const wd = WEEKDAYS[d.getDay()];
  return wd.charAt(0).toUpperCase()+wd.slice(1)+', '+d.getDate()+' '+MONTHS[d.getMonth()];
}
function isUnlocked(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(iso+'T00:00:00');
  return today >= d;
}

function render(activeIdx){
  const nav = document.getElementById('lessons');
  nav.innerHTML = lessons.map((l,i)=>{
    const unlocked = isUnlocked(l.date);
    return `<button class="lessonbtn ${i===activeIdx?'active':''} ${unlocked?'':'locked'}" data-i="${i}">
      <div class="row"><span class="num">УРОК ${i+1}</span>${unlocked?'':'<span class="lock">закрыт</span>'}</div>
      <div class="title">${l.title}</div>
      <div class="date">${fmt(l.date)}</div>
    </button>`;
  }).join('');
  [...nav.querySelectorAll('.lessonbtn')].forEach(b=>{
    b.addEventListener('click', ()=> render(parseInt(b.dataset.i)));
  });

  const l = lessons[activeIdx];
  const unlocked = isUnlocked(l.date);
  const content = document.getElementById('content');

  if(!unlocked){
    content.innerHTML = `
      <div class="content-wrap">
        <div class="l-kicker">УРОК ${activeIdx+1} · ${fmt(l.date)}</div>
        <h1 class="l-title">${l.title}</h1>
      </div>
      <div class="locked-panel">
        <div class="txt">Этот урок ещё не прошёл — материалы откроются ${fmt(l.date).toLowerCase()}.</div>
      </div>`;
    content.scrollTop = 0;
    document.getElementById('main').scrollTop = 0;
    return;
  }

  content.innerHTML = `
    <div class="content-wrap">
      <div class="l-kicker">УРОК ${activeIdx+1} · ${fmt(l.date)}</div>
      <h1 class="l-title">${l.title}</h1>
      <div class="l-meta">${l.theme}</div>
    </div>

    <section class="block"><h2>ЧТО ДЕЛАЛИ</h2><div class="txt">${l.chto}</div></section>
    <section class="block"><h2>РАЗБИРАЕМ</h2><ul>${l.razb.map(x=>`<li>${x}</li>`).join('')}</ul></section>
    <section class="block"><h2>ПОШАГОВО</h2><ol class="${l.shots && l.shots.length===l.posh.length ? 'step-illustrated' : ''}">${l.posh.map((x,i)=> (l.shots && l.shots[i]) ? `<li><div class="step-text">${x}</div><div class="step-shot"><img src="${l.shots[i].src}" alt="${l.shots[i].cap}"><div class="cap">${l.shots[i].cap}</div></div></li>` : `<li>${x}</li>`).join('')}</ol></section>
    <section class="block"><h2>ПОПРОБУЙ САМ</h2><div class="txt">${l.pop}</div></section>
    <section class="block"><h2>ДОМАШКА</h2><div class="txt">${l.dom}</div></section>
    <section class="block skip"><h2>ЕСЛИ ПРОПУСТИЛ</h2><ul>${l.esli.map(x=>`<li>${x}</li>`).join('')}</ul></section>
    ${l.files ? `<section class="block files"><h2>ФАЙЛЫ</h2><div class="txt">${l.files}</div></section>` : ''}
  `;
  content.scrollTop = 0;
  document.getElementById('main').scrollTop = 0;
}

// открыть первый доступный урок
let startIdx = lessons.findIndex(l=>isUnlocked(l.date));
if(startIdx === -1) startIdx = 0;
for(let i=lessons.length-1;i>=0;i--){ if(isUnlocked(lessons[i].date)) startIdx = i; }
render(startIdx);
</script>
